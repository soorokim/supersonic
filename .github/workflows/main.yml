name: CI

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Build (test)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update ArgoCD repo
        env:
          ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          FULL_SHA=${{ github.sha }}
          VALUES=$(curl -sH "Authorization: token $ARGOCD_TOKEN" \
            "https://api.github.com/repos/soorokim/argocd/contents/supersonic/values.yaml")
          SHA=$(echo "$VALUES" | jq -r '.sha')
          echo "$VALUES" | jq -r '.content' | base64 -d | \
            sed "s|tag: .*|tag: ${FULL_SHA}|" | \
            sed "s|repository: .*|repository: ghcr.io/soorokim/supersonic|" > /tmp/values.yaml
          CHART=$(curl -sH "Authorization: token $ARGOCD_TOKEN" \
            "https://api.github.com/repos/soorokim/argocd/contents/supersonic/Chart.yaml")
          CHART_SHA=$(echo "$CHART" | jq -r '.sha')
          echo "$CHART" | jq -r '.content' | base64 -d | \
            sed "s|version: .*|version: 1.0.0-${GIT_HASH}|" > /tmp/Chart.yaml
          CONTENT_B64=$(base64 -w0 /tmp/values.yaml)
          curl -sX PUT -H "Authorization: token $ARGOCD_TOKEN" \
            "https://api.github.com/repos/soorokim/argocd/contents/supersonic/values.yaml" \
            -d "{\"message\":\"chore: update supersonic to ${GIT_HASH}\",\"content\":\"${CONTENT_B64}\",\"sha\":\"${SHA}\"}"
          CHART_B64=$(base64 -w0 /tmp/Chart.yaml)
          curl -sX PUT -H "Authorization: token $ARGOCD_TOKEN" \
            "https://api.github.com/repos/soorokim/argocd/contents/supersonic/Chart.yaml" \
            -d "{\"message\":\"chore: bump chart version to ${GIT_HASH}\",\"content\":\"${CHART_B64}\",\"sha\":\"${CHART_SHA}\"}"
